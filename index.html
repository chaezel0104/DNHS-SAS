<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#0755c9">

  <title>Dalandanan National High School - QR Attendance</title>

  <link rel="stylesheet" href="style.css">

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

</head>

<body>

  <main class="app">

    <!-- SCHOOL HEADER -->
    <header class="school-header">

      <img
        src="school-logo.jpg"
        class="school-logo"
        alt="Dalandanan National High School Logo">

      <div class="school-name">
        <h1>DALANDANAN</h1>
        <h2>NATIONAL HIGH SCHOOL</h2>
        <p>VALENZUELA CITY</p>
      </div>

    </header>


    <!-- TITLE -->
    <section class="title-section">

      <h3>QR ATTENDANCE</h3>

      <p>
        Scan your QR code to record attendance
      </p>

    </section>


    <!-- SCANNER -->
    <section class="scanner-card">

      <div id="scanner"></div>

      <div class="scanner-instruction">

        <span class="camera-icon">📷</span>

        <span>
          Position the QR code within the frame
        </span>

      </div>

    </section>


    <!-- START CAMERA -->
    <button
      id="startCamera"
      class="start-button">

      <span>📷</span>

      START CAMERA

    </button>


    <!-- SCANNED CODE -->
    <section class="code-card">

      <div class="code-title">

        <span class="qr-icon">▣</span>

        <span>SCANNED CODE</span>

      </div>

      <div
        id="scannedCode"
        class="scanned-code">

        —

      </div>

    </section>


    <!-- ATTENDANCE BUTTONS -->
    <section class="attendance-buttons">

      <button
        id="timeIn"
        class="attendance-button time-in"
        disabled>

        <span class="button-icon">→</span>

        <span>
          <strong>TIME IN</strong>
          <small>Record Time In</small>
        </span>

      </button>


      <button
        id="timeOut"
        class="attendance-button time-out"
        disabled>

        <span class="button-icon">→</span>

        <span>
          <strong>TIME OUT</strong>
          <small>Record Time Out</small>
        </span>

      </button>

    </section>


    <!-- STATUS -->
    <section class="status-card">

      <div class="status-icon">
        ✓
      </div>

      <div>

        <div
          id="message"
          class="status-message">

          Tap START CAMERA.

        </div>

      </div>

    </section>


    <!-- FOOTER -->
    <footer>

      <strong>
        Dalandanan National High School
      </strong>

      <span>
        Valenzuela City
      </span>

      <small>
        QR Attendance System
      </small>

    </footer>

  </main>

  <script src="app.js"></script>

</body>

</html>
